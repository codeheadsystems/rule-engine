org.gradle.caching=true
org.gradle.parallel=true

#
# Project identity. Both are read by every module -- a root gradle.properties sets project
# properties on the whole build -- so a module's build file never restates them.
#
# The version here is the NEXT version, and a working tree always builds a SNAPSHOT. A release is
# made by tagging vX.Y.Z, which settings.gradle.kts reads and substitutes; see RELEASING.md. Bump
# this after a release, not before one.
#
group=com.codeheadsystems
version=1.0.0-SNAPSHOT
