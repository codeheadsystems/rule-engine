version: 2

updates:
  # Every `uses:` line under .github/workflows/. gradle.yml pins major tags (@v5, @v6, @v7), so
  # this mostly catches a move to the next major there; release.yml and pages.yml pin full commit
  # SHAs, so this is what actually bumps them -- Dependabot rewrites the trailing "# vX.Y.Z"
  # comment too, so it is machine-maintained, not just a note for humans. auto-dependabot.yml
  # calls the gh CLI directly and has no `uses:` line, so it contributes nothing here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: thursday
    groups:
      # Grouped because gradle/libs.versions.toml shares one `version.ref` across several artifacts
      # in each of these families. Ungrouped, Dependabot opens a PR per artifact and every one of
      # them edits the same line in [versions] -- so all but the first conflict, and merging them
      # in the wrong order silently reverts a bump. Grouping is what makes a version catalog and
      # Dependabot get along.
      # tools.jackson*, not com.fasterxml.jackson*: Jackson 3 changed the group id, and a pattern
      # left pointing at the old one would match nothing and silently stop grouping.
      jackson:
        patterns:
          - tools.jackson*
      # networknt is deliberately NOT in that group. Only one artifact uses its version.ref, so the
      # same-line-conflict rationale does not apply, and the two projects release independently.
      # Note the consequence, since nothing here encodes it: libs.versions.toml says networknt's
      # major tracks our Jackson major, and with no `ignore` rule a networknt 4.x PR will arrive on
      # its own and fail CI. That is the intended outcome -- a red build is the right way to be told
      # a major needs a decision -- but it is better read here than rediscovered.
      jmh:
        patterns:
          - org.openjdk.jmh:*
          - me.champeau.jmh*
      junit:
        patterns:
          - org.junit*
    # A Jackson major is a major version *here* (CLAUDE.md: JsonNode is in ~60 public signatures,
    # -core declares jackson `api`), and that is a judgment CI cannot make -- a Jackson 4.x bump
    # could compile and pass the suite while still being a breaking change for every consumer.
    # Auto-merge has no such filter (github-actions bumps included, by explicit choice), so this
    # is the one place that decision needs to be kept out of it. Unlike networknt above, this is
    # `ignore` rather than a red build: no PR opens at all, so nothing here will announce that a
    # Jackson major shipped -- the networknt bump failing CI on its own major bump is that signal.
    ignore:
      - dependency-name: "tools.jackson*"
        update-types: ["version-update:semver-major"]
