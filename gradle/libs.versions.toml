[versions]
assertj = "3.27.7"
jackson = "2.22.1"
jmh = "1.37"
re2j = "1.8"
jmh-plugin = "0.7.3"
junit-jupiter = "6.1.3"
# The 3.x line moved to Jackson 3 (tools.jackson.*), a different tree model from the
# com.fasterxml JsonNode this engine is built on. Following it there is gated on the whole
# project moving to Jackson 3, not on this module. 2.0.7 pins jackson 2.22.1, matching above.
networknt = "2.0.7"
slf4j = "2.0.18"

[libraries]
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "networknt" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[bundles]
test = ["junit-jupiter", "assertj"]

[plugins]
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
