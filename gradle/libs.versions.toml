[versions]
assertj = "3.27.7"
jackson = "3.2.2"
jmh = "1.37"
re2j = "1.8"
jmh-plugin = "0.7.3"
junit-jupiter = "6.1.3"
cel = "0.14.0"
# Tracks the jackson line above: networknt 3.x is the Jackson 3 line, 2.x the Jackson 2 one. The
# project maintains both in parallel, so this pin follows our tree model rather than their support.
networknt = "3.0.7"
slf4j = "2.0.18"

[libraries]
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
cel = { module = "dev.cel:cel", version.ref = "cel" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "networknt" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[bundles]
test = ["junit-jupiter", "assertj"]

[plugins]
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
